[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-stress-engine"
dynamic = ["version"]
description = "Deterministic JSON-driven credit stress testing engine."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.3.4,<4",
  "numpy>=1.20.3,<3",
  "openpyxl>=3.0.9,<4",
]

[project.scripts]
credit-stress = "stress_engine.cli:main"

[tool.setuptools.packages.find]
include = ["stress_engine*"]

[tool.setuptools.dynamic]
version = {attr = "stress_engine.version.VERSION"}
