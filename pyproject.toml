[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-stress-engine"
dynamic = ["version"]
description = "Deterministic JSON-driven credit stress testing engine."
requires-python = ">=3.9"
dependencies = [
  "pandas",
  "numpy",
  "openpyxl",
]

[project.scripts]
credit-stress = "stress_engine.cli:main"

[tool.setuptools.packages.find]
include = ["stress_engine*"]

[tool.setuptools.dynamic]
version = {attr = "stress_engine.version.VERSION"}
